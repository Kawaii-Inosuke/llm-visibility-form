<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Visibility Tracker — Submit a job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fb; --card:#fff; --line:#e3e6ef; --ink:#1c1f2b;
    --mut:#8a90a8; --accent:#35357a; --accent-dk:#2b2b66; --accent-ink:#fff;
    --accent-soft:#f1f2f9; --ok:#1c7a4a; --ok-bg:#eaf6f0; --ok-line:#bfe3d0;
    --warn:#b06a00; --warn-line:#e8b86a; --warn-bg:#fdf6ea;
    --err:#b42318; --err-bg:#fdf0ef; --err-line:#f0c2be;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:40px 16px 56px}
  .wrap{max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 1px 2px rgba(28,31,43,.04),0 8px 28px rgba(28,31,43,.06);
    overflow:hidden}
  .card::before{content:"";display:block;height:3px;background:var(--accent)}
  .inner{padding:32px 34px 34px}

  .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .brand img{height:38px;width:auto;display:block}
  h1{font-size:19px;font-weight:600;color:var(--accent);margin:0;letter-spacing:-.01em}
  .sub{color:var(--mut);font-size:13.5px;margin:0 0 4px;line-height:1.5}

  .sec{padding:22px 0;border-top:1px solid var(--line)}
  .sec:first-of-type{border-top:0;padding-top:4px}

  label.field{display:block;font-size:12.5px;font-weight:500;color:var(--mut);
    margin:0 0 7px;letter-spacing:.01em}
  .hint{font-weight:400;color:var(--mut);font-size:12.5px}

  input[type=email],input[type=text],input[type=number]{
    width:100%;padding:11px 13px;background:#fff;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;font-size:14.5px;
    font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:#b5bacb}
  input:focus{outline:0;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(53,53,122,.12)}

  .engines{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .eng{display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;
    user-select:none;font-size:14px;transition:border-color .15s,background .15s}
  .eng:hover{border-color:#cdd2e3;background:#fcfcfe}
  .eng input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}

  .row{display:flex;gap:18px;flex-wrap:wrap}
  .row > div{flex:1;min-width:180px}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#fff}
  .seg button{padding:10px 22px;background:#fff;color:var(--mut);
    border:0;cursor:pointer;font-size:14.5px;font-family:inherit;font-weight:500;
    transition:background .15s,color .15s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

  .prompt{display:flex;gap:9px;margin-bottom:8px;align-items:center}
  .prompt .pid{color:var(--mut);width:28px;font-size:13px;font-weight:500;
    font-variant-numeric:tabular-nums}
  .prompt input{flex:1}
  .prompt button{background:#fff;border:1px solid var(--line);color:var(--mut);
    border-radius:8px;width:36px;height:40px;cursor:pointer;font-size:17px;
    line-height:1;transition:border-color .15s,color .15s}
  .prompt button:hover{border-color:#cdd2e3;color:var(--ink)}
  .addbtn{background:#fff;border:1px dashed #cdd2e3;color:var(--accent);
    border-radius:8px;padding:10px 15px;cursor:pointer;font-size:13.5px;
    font-family:inherit;font-weight:600;margin-top:4px;transition:border-color .15s,background .15s}
  .addbtn:hover{border-color:var(--accent);background:var(--accent-soft)}

  .estimate{display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--accent-soft);border:1px solid #dfe1ef;border-radius:8px;
    padding:13px 15px;margin:22px 0 16px;font-size:13.5px;color:#4a4f66}
  .estimate b{font-size:15px;color:var(--accent);font-weight:600;white-space:nowrap}
  .estimate.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .estimate.warn b{color:var(--warn)}

  .submit{width:100%;padding:14px;background:var(--accent);color:var(--accent-ink);
    border:0;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;
    font-family:inherit;letter-spacing:.01em;transition:background .15s}
  .submit:hover:not(:disabled){background:var(--accent-dk)}
  .submit:disabled{opacity:.5;cursor:not-allowed}

  .msg{padding:12px 14px;border-radius:8px;margin-top:14px;display:none;font-size:13.5px}
  .msg.show{display:block}
  .msg.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
  .msg.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err)}

  .vpn{font-size:12.5px;color:var(--warn);margin-top:8px;line-height:1.45}

  @media (max-width:520px){ .inner{padding:24px 20px 28px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="inner">

      <!-- Logo lives at public/logo.svg (copied from Logo-91Ninjas.svg) -->
      <div class="brand">
        <img src="./logo.svg" alt="91Ninjas">
        <h1>LLM Visibility Tracker</h1>
      </div>
      <p class="sub">Submit prompts to run across AI answer engines. You'll get the results as an Excel file by email.</p>

      <div class="sec">
        <label class="field" for="email">Your email <span class="hint">— where the Excel is sent</span></label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
      </div>

      <div class="sec">
        <label class="field">Engines <span class="hint">— all on by default, untick any you don't want</span></label>
        <div class="engines" id="engines"></div>
      </div>

      <div class="sec">
        <div class="row">
          <div>
            <label class="field">Region</label>
            <div class="seg" id="region">
              <button type="button" data-r="us">USA</button>
              <button type="button" data-r="in" class="on">India</button>
            </div>
            <div class="vpn" id="vpn" style="display:none">USA runs need the operator's VPN on — it may take a little longer to start.</div>
          </div>
          <div>
            <label class="field" for="runs">Runs per prompt <span class="hint">— 1 to 10</span></label>
            <input type="number" id="runs" min="1" max="10" value="5">
          </div>
        </div>
      </div>

      <div class="sec">
        <label class="field">Prompts <span class="hint">— one per line, in order</span></label>
        <div id="prompts"></div>
        <button type="button" class="addbtn" id="add">+ Add another prompt</button>
      </div>

      <div class="estimate" id="estimate">
        <span id="estText">—</span>
        <b id="estTime"></b>
      </div>

      <button class="submit" id="submit">Submit job</button>
      <div class="msg" id="msg"></div>

    </div>
  </div>
</div>

<script>
const ENGINES = [
  ["chatgpt","ChatGPT"],["gemini","Gemini"],["claude","Claude"],
  ["perplexity","Perplexity"],["copilot","Copilot"],
  ["ai_overview","AI Overview"],["ai_mode","AI Mode"],
];
const SECS_PER_RUN = 50;
const SOFT_CAP = 200;

const $ = s => document.querySelector(s);
const engBox = $("#engines");
ENGINES.forEach(([id,name])=>{
  const l=document.createElement("label"); l.className="eng";
  l.innerHTML=`<input type="checkbox" value="${id}" checked><span>${name}</span>`;
  engBox.appendChild(l);
});

let region="in";
$("#region").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  region=b.dataset.r;
  [...$("#region").children].forEach(x=>x.classList.toggle("on",x===b));
  $("#vpn").style.display = region==="us" ? "block":"none";
  recalc();
});

const promptsBox=$("#prompts");
function renumber(){
  [...promptsBox.children].forEach((row,i)=>{
    row.querySelector(".pid").textContent="P"+(i+1);
  });
}
function addPrompt(val=""){
  const row=document.createElement("div"); row.className="prompt";
  row.innerHTML=`<span class="pid"></span>
    <input type="text" placeholder="e.g. AI gateway" value="${val.replace(/"/g,'&quot;')}">
    <button type="button" title="Remove">×</button>`;
  row.querySelector("button").onclick=()=>{
    if(promptsBox.children.length>1){row.remove();renumber();recalc();}
  };
  row.querySelector("input").addEventListener("input",recalc);
  promptsBox.appendChild(row); renumber();
}
$("#add").onclick=()=>{addPrompt();recalc();};
addPrompt();

function selectedEngines(){
  return [...engBox.querySelectorAll("input:checked")].map(c=>c.value);
}
function filledPrompts(){
  return [...promptsBox.querySelectorAll("input")].map(i=>i.value.trim()).filter(Boolean);
}
function recalc(){
  const e=selectedEngines().length, p=filledPrompts().length;
  const r=Math.max(1,Math.min(10,parseInt($("#runs").value)||0));
  const total=e*p*r;
  const est=$("#estimate");
  if(!total){ $("#estText").textContent="Add a prompt and pick at least one engine.";
    $("#estTime").textContent=""; est.classList.remove("warn"); return; }
  const mins=Math.round(total*SECS_PER_RUN/60);
  const t = mins>=60 ? `~${Math.floor(mins/60)}h ${mins%60}m` : `~${mins}m`;
  $("#estText").textContent=`${p} prompt(s) × ${r} run(s) × ${e} engine(s) = ${total} runs`;
  $("#estTime").textContent=t;
  est.classList.toggle("warn", total>SOFT_CAP);
}
engBox.addEventListener("change",recalc);
$("#runs").addEventListener("input",recalc);
recalc();

function show(kind,text){
  const m=$("#msg"); m.className="msg show "+kind; m.textContent=text;
}

$("#submit").onclick=async ()=>{
  const email=$("#email").value.trim();
  const engines=selectedEngines();
  const prompts=filledPrompts();
  const runs=Math.max(1,Math.min(10,parseInt($("#runs").value)||0));

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show("err","Enter a valid email address.");
  if(!engines.length) return show("err","Pick at least one engine.");
  if(!prompts.length) return show("err","Add at least one prompt.");

  const total=engines.length*prompts.length*runs;
  if(total>SOFT_CAP && !confirm(`This is ${total} runs, roughly ${Math.round(total*SECS_PER_RUN/60)} minutes. Submit anyway?`)) return;

  const job={
    email, region, runs_per_prompt:runs, engines,
    prompts: prompts.map((p,i)=>({id:"P"+(i+1),prompt:p})),
  };

  const btn=$("#submit"); btn.disabled=true; btn.textContent="Submitting…";
  try{
    const res=await fetch("/api/submit",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(job),
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok){
      show("ok","Submitted — you'll get an email when it's done.");
      btn.textContent="Submitted"; return;
    }
    show("err", data.error || "Something went wrong. Please try again or tell the operator.");
    btn.disabled=false; btn.textContent="Submit job";
  }catch(err){
    show("err","Network error. Please try again.");
    btn.disabled=false; btn.textContent="Submit job";
  }
};
</script>
</body>
</html>
