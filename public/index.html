<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Visibility Tracker — Submit a job</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --ink:#e7ebf0;
    --mut:#9aa4b2; --accent:#5b8cff; --accent-ink:#fff;
    --ok:#2ecc71; --warn:#e6a417; --err:#ff5c5c; --chip:#1f242e;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fa; --card:#fff; --line:#e2e7ef; --ink:#1a1f27;
           --mut:#5a6472; --chip:#eef1f6; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:32px 16px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:20px;margin-bottom:16px}
  label.field{display:block;font-weight:600;margin:0 0 8px}
  .hint{font-weight:400;color:var(--mut);font-size:13px}
  input[type=email],input[type=text],input[type=number]{
    width:100%;padding:10px 12px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;font-size:15px}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .engines{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .eng{display:flex;align-items:center;gap:9px;padding:10px 12px;
    background:var(--chip);border:1px solid var(--line);border-radius:9px;cursor:pointer;user-select:none}
  .eng input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row > div{flex:1;min-width:180px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{padding:10px 20px;background:var(--bg);color:var(--ink);
    border:0;cursor:pointer;font-size:15px}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .prompt{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .prompt .pid{color:var(--mut);width:30px;font-variant-numeric:tabular-nums}
  .prompt input{flex:1}
  .prompt button{background:transparent;border:1px solid var(--line);color:var(--mut);
    border-radius:8px;width:34px;height:38px;cursor:pointer;font-size:18px}
  .addbtn{background:transparent;border:1px dashed var(--line);color:var(--accent);
    border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600}
  .estimate{display:flex;justify-content:space-between;align-items:center;
    background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .estimate b{font-size:17px}
  .estimate.warn{border-color:var(--warn)}
  .submit{width:100%;padding:14px;background:var(--accent);color:var(--accent-ink);
    border:0;border-radius:11px;font-size:16px;font-weight:700;cursor:pointer}
  .submit:disabled{opacity:.55;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:10px;margin-top:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(46,204,113,.12);border:1px solid var(--ok);color:var(--ok)}
  .msg.err{background:rgba(255,92,92,.12);border:1px solid var(--err);color:var(--err)}
  .vpn{font-size:13px;color:var(--warn);margin-top:6px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>LLM Visibility Tracker</h1>
  <p class="sub">Submit prompts to run across AI answer engines. You'll get the results as an Excel file by email.</p>

  <div class="card">
    <label class="field" for="email">Your email <span class="hint">— where the Excel is sent</span></label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
  </div>

  <div class="card">
    <label class="field">Engines <span class="hint">— all on by default, untick any you don't want</span></label>
    <div class="engines" id="engines"></div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label class="field">Region</label>
        <div class="seg" id="region">
          <button type="button" data-r="us" class="on">USA</button>
          <button type="button" data-r="in">India</button>
        </div>
        <div class="vpn" id="vpn">USA runs need the operator's VPN on — it may take a little longer to start.</div>
      </div>
      <div>
        <label class="field" for="runs">Runs per prompt <span class="hint">— 1 to 10</span></label>
        <input type="number" id="runs" min="1" max="10" value="5">
      </div>
    </div>
  </div>

  <div class="card">
    <label class="field">Prompts <span class="hint">— one per line, in order</span></label>
    <div id="prompts"></div>
    <button type="button" class="addbtn" id="add">+ Add another prompt</button>
  </div>

  <div class="estimate" id="estimate">
    <span id="estText">—</span>
    <b id="estTime"></b>
  </div>

  <button class="submit" id="submit">Submit job</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const ENGINES = [
  ["chatgpt","ChatGPT"],["gemini","Gemini"],["claude","Claude"],
  ["perplexity","Perplexity"],["copilot","Copilot"],
  ["ai_overview","AI Overview"],["ai_mode","AI Mode"],
];
const SECS_PER_RUN = 50;
const SOFT_CAP = 200;

const $ = s => document.querySelector(s);
const engBox = $("#engines");
ENGINES.forEach(([id,name])=>{
  const l=document.createElement("label"); l.className="eng";
  l.innerHTML=`<input type="checkbox" value="${id}" checked><span>${name}</span>`;
  engBox.appendChild(l);
});

let region="us";
$("#region").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  region=b.dataset.r;
  [...$("#region").children].forEach(x=>x.classList.toggle("on",x===b));
  $("#vpn").style.display = region==="us" ? "block":"none";
  recalc();
});

const promptsBox=$("#prompts");
function renumber(){
  [...promptsBox.children].forEach((row,i)=>{
    row.querySelector(".pid").textContent="P"+(i+1);
  });
}
function addPrompt(val=""){
  const row=document.createElement("div"); row.className="prompt";
  row.innerHTML=`<span class="pid"></span>
    <input type="text" placeholder="e.g. AI gateway" value="${val.replace(/"/g,'&quot;')}">
    <button type="button" title="Remove">×</button>`;
  row.querySelector("button").onclick=()=>{
    if(promptsBox.children.length>1){row.remove();renumber();recalc();}
  };
  row.querySelector("input").addEventListener("input",recalc);
  promptsBox.appendChild(row); renumber();
}
$("#add").onclick=()=>{addPrompt();recalc();};
addPrompt();

function selectedEngines(){
  return [...engBox.querySelectorAll("input:checked")].map(c=>c.value);
}
function filledPrompts(){
  return [...promptsBox.querySelectorAll("input")].map(i=>i.value.trim()).filter(Boolean);
}
function recalc(){
  const e=selectedEngines().length, p=filledPrompts().length;
  const r=Math.max(1,Math.min(10,parseInt($("#runs").value)||0));
  const total=e*p*r;
  const est=$("#estimate");
  if(!total){ $("#estText").textContent="Add a prompt and pick at least one engine.";
    $("#estTime").textContent=""; est.classList.remove("warn"); return; }
  const mins=Math.round(total*SECS_PER_RUN/60);
  const t = mins>=60 ? `~${Math.floor(mins/60)}h ${mins%60}m` : `~${mins}m`;
  $("#estText").textContent=`${p} prompt(s) × ${r} run(s) × ${e} engine(s) = ${total} runs`;
  $("#estTime").textContent=t;
  est.classList.toggle("warn", total>SOFT_CAP);
}
engBox.addEventListener("change",recalc);
$("#runs").addEventListener("input",recalc);
recalc();

function show(kind,text){
  const m=$("#msg"); m.className="msg show "+kind; m.textContent=text;
}

$("#submit").onclick=async ()=>{
  const email=$("#email").value.trim();
  const engines=selectedEngines();
  const prompts=filledPrompts();
  const runs=Math.max(1,Math.min(10,parseInt($("#runs").value)||0));

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show("err","Enter a valid email address.");
  if(!engines.length) return show("err","Pick at least one engine.");
  if(!prompts.length) return show("err","Add at least one prompt.");

  const total=engines.length*prompts.length*runs;
  if(total>SOFT_CAP && !confirm(`This is ${total} runs, roughly ${Math.round(total*SECS_PER_RUN/60)} minutes. Submit anyway?`)) return;

  const job={
    email, region, runs_per_prompt:runs, engines,
    prompts: prompts.map((p,i)=>({id:"P"+(i+1),prompt:p})),
  };

  const btn=$("#submit"); btn.disabled=true; btn.textContent="Submitting…";
  try{
    const res=await fetch("/api/submit",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(job),
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok){
      show("ok","Submitted — you'll get an email when it's done.");
      btn.textContent="Submitted"; return;
    }
    show("err", data.error || "Something went wrong. Please try again or tell the operator.");
    btn.disabled=false; btn.textContent="Submit job";
  }catch(err){
    show("err","Network error. Please try again.");
    btn.disabled=false; btn.textContent="Submit job";
  }
};
</script>
</body>
</html>
